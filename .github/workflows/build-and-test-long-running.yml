name: Build and Test (Long Running Integration)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test (Long Running Integration)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0-noble

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore
        run: ./eng/restore.sh

      - name: Build
        run: ./eng/build.sh

      - name: Prepare test results directory
        run: mkdir -p TestResults

      - name: Test — Core
        run: >
          dotnet run --no-build -c Release
          --project tests/Fletched.Core.Tests/Fletched.Core.Tests.csproj
          -- --coverage --coverage-output-format cobertura
          --coverage-output ./Fletched.Core.Tests.cobertura.xml

      - name: Test — Features
        run: >
          dotnet run --no-build -c Release
          --project tests/Fletched.Features.Tests/Fletched.Features.Tests.csproj
          -- --coverage --coverage-output-format cobertura
          --coverage-output ./Fletched.Features.Tests.cobertura.xml

      - name: Test — Integration (Long Running Enabled)
        env:
          FLETCHED_RUN_LONG_RUNNING_INTEGRATION_TESTS: "1"
        run: >
          dotnet run --no-build -c Release
          --project tests/Fletched.Integration.Tests/Fletched.Integration.Tests.csproj
          -- --coverage --coverage-output-format cobertura
          --coverage-output ./Fletched.Integration.Tests.cobertura.xml

      - name: Generate coverage report
        if: always()
        uses: danielpalme/ReportGenerator-GitHub-Action@5.5.1
        with:
          reports: 'tests/**/bin/Release/net10.0/TestResults/*.cobertura.xml'
          targetdir: './TestResults/coverage-report'
          reporttypes: 'Html'

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: tests/**/bin/Release/net10.0/TestResults/*.html
          if-no-files-found: warn

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: TestResults/coverage-report
          if-no-files-found: warn
