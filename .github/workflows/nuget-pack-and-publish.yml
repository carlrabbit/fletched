name: NuGet Pack and Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer package version (for example 0.1.0 or 0.1.0-beta.1)
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  pack:
    name: Pack NuGet Packages
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0-noble
    outputs:
      packageVersion: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "value=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Package version: ${VERSION}"

      - name: Restore
        run: ./eng/restore.sh

      - name: Build
        run: ./eng/build.sh

      - name: Pack NuGet packages
        run: ./eng/package.sh ${{ steps.version.outputs.value }}

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-${{ steps.version.outputs.value }}
          path: artifacts/nuget/*
          if-no-files-found: error

  publish:
    name: Publish to nuget.org
    needs: pack
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0-noble
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download NuGet packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages-${{ needs.pack.outputs.packageVersion }}
          path: artifacts/nuget

      - name: Publish NuGet packages
        run: ./eng/publish.sh
