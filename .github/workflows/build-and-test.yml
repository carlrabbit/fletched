name: Build and Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Fletched.slnx

      - name: Build
        run: dotnet build Fletched.slnx --no-restore --configuration Release

      - name: Test (Fletched.Core.Tests)
        run: dotnet run --no-build --project tests/Fletched.Core.Tests/Fletched.Core.Tests.csproj --configuration Release

      - name: Test (Fletched.Features.Tests)
        run: dotnet run --no-build --project tests/Fletched.Features.Tests/Fletched.Features.Tests.csproj --configuration Release

      - name: Test (Fletched.Integration.Tests)
        run: dotnet run --no-build --project tests/Fletched.Integration.Tests/Fletched.Integration.Tests.csproj --configuration Release
