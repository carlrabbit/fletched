name: Build and Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0-noble

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate
        run: ./eng/check.sh

      - name: Prepare test results directory
        run: mkdir -p TestResults

      - name: Collect coverage
        run: ./eng/ci/collect-coverage.sh standard

      - name: Generate coverage report
        if: always()
        uses: danielpalme/ReportGenerator-GitHub-Action@5.5.1
        with:
          reports: 'tests/**/bin/Release/net10.0/TestResults/*.cobertura.xml'
          targetdir: './TestResults/coverage-report'
          reporttypes: 'Html'

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: tests/**/bin/Release/net10.0/TestResults/*.html
          if-no-files-found: warn

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: TestResults/coverage-report
          if-no-files-found: warn
