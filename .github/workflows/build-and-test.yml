name: Build and Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0-noble

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore dependencies
        run: dotnet restore Fletched.slnx

      - name: Build
        run: dotnet build Fletched.slnx --no-restore --configuration Release

      - name: Test (Fletched.Core.Tests)
        run: >-
          dotnet run --no-build
          --project tests/Fletched.Core.Tests/Fletched.Core.Tests.csproj
          --configuration Release
          -- --coverage --coverage-output-format cobertura

      - name: Test (Fletched.Features.Tests)
        run: >-
          dotnet run --no-build
          --project tests/Fletched.Features.Tests/Fletched.Features.Tests.csproj
          --configuration Release
          -- --coverage --coverage-output-format cobertura

      - name: Test (Fletched.Integration.Tests)
        run: >-
          dotnet run --no-build
          --project tests/Fletched.Integration.Tests/Fletched.Integration.Tests.csproj
          --configuration Release
          -- --coverage --coverage-output-format cobertura

      - name: Generate coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@5.5.1
        with:
          reports: 'tests/**/TestResults/*.cobertura.xml'
          targetdir: TestResults/coverage-report
          reporttypes: 'HtmlInline;Cobertura'

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: tests/**/bin/Release/net10.0/TestResults/*.html

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: TestResults/coverage-report
