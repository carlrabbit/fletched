name: Performance Testing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0-noble

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore
        run: ./eng/restore.sh

      - name: Build
        run: ./eng/build.sh

      - name: Test — Performance
        run: >
          dotnet run --no-build -c Release
          --project tests/Fletched.Performance.Tests/Fletched.Performance.Tests.csproj
          -- --coverage --coverage-output-format cobertura
          --coverage-output ./Fletched.Performance.Tests.cobertura.xml

      - name: Upload performance test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-test-report
          path: tests/Fletched.Performance.Tests/bin/Release/net10.0/TestResults/*.html
          if-no-files-found: warn

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0-noble

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore
        run: ./eng/restore.sh

      - name: Build (Release)
        run: ./eng/benchmark.sh

      - name: Run benchmarks
        run: >
          dotnet run --no-build -c Release
          --project benchmarks/Fletched.Benchmarks/Fletched.Benchmarks.csproj
          -- --filter '*' --exporters json --artifacts ./BenchmarkResults

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: BenchmarkResults/**
          if-no-files-found: warn
