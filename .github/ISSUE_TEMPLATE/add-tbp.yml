name: Add or revise a TBP
description: Request a new reusable Task Best Practice or a revision to an existing one.
title: "TBP: "
labels:
  - documentation
  - process
body:
  - type: markdown
    attributes:
      value: |
        Review `docs/tbps/add-tbp.md`, `docs/TBPS.md`, and `docs/TERMINOLOGY.md` before filing.
  - type: input
    id: tbp-name
    attributes:
      label: TBP name
      placeholder: feature-implementation
    validations:
      required: true
  - type: textarea
    id: class-of-work
    attributes:
      label: Class of work this TBP should cover
    validations:
      required: true
  - type: textarea
    id: reuse-case
    attributes:
      label: Why is this reusable?
      description: Explain why this belongs in a TBP instead of an issue, spec, or milestone.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and non-goals
    validations:
      required: true
  - type: textarea
    id: related-docs
    attributes:
      label: Related documents to review
