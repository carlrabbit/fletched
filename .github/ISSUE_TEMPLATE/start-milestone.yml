name: Start milestone
description: Prepare an existing milestone for implementation.
title: "Start milestone: "
labels:
  - documentation
  - milestone
body:
  - type: markdown
    attributes:
      value: |
        Review `docs/tbps/start-milestone.md`, the milestone document, related specs, and related decisions before filing.
  - type: input
    id: milestone-doc
    attributes:
      label: Milestone document
      placeholder: docs/milestones/milestone-xx-name.md
    validations:
      required: true
  - type: textarea
    id: required-specs
    attributes:
      label: Required specs and status
      description: Note whether each required spec is present or explicitly missing.
    validations:
      required: true
  - type: textarea
    id: open-decisions
    attributes:
      label: Open decisions or unresolved questions
    validations:
      required: true
  - type: textarea
    id: implementation-issues
    attributes:
      label: Planned implementation issues
      description: Link or describe the issues that will execute the milestone.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation and exit-criteria readiness
    validations:
      required: true
